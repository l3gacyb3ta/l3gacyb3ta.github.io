name: AUTOBUILD

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - uses: actions/checkout@v7
    - uses: actions/configure-pages@v6
    - uses: actions/cache/restore@v5
      id: cache-media-restore
      with:
        path: |
          data/media/*
        key: media-cache-${{ hashFiles('data/original_media/*') }}
    - name: install imagemagick
      if: steps.cache-media-restore.outputs.cache-hit != 'true'
      uses: mfinelli/setup-imagemagick@v8
    - name: media creation
      if: steps.cache-media-restore.outputs.cache-hit != 'true'
      run: ./batchVariants.sh
    - name: cache media
      if: steps.cache-media-restore.outputs.cache-hit != 'true'
      id: cache-media-save
      uses: actions/cache/save@v5
      with:
        path: |
          data/media/*
        key: media-cache-${{ hashFiles('data/original_media/*') }}
    - name: create folders
      run: mkdir bin out out/links out/media
    - name: copy data
      run: cp -r data/media/* out/media && cp -r data/links/* out/links && cp -r data/static/. out/
    - name: compile
      run: cc src/main.c -g -O0 -std=c89 -Wall -Wno-unknown-pragmas -o bin/aethopica 
    - name: build site
      run: cd data && ../bin/aethopica
    - name: og cards
      run: |
        command -v magick >/dev/null || command -v convert >/dev/null \
          || sudo apt-get install -y --no-install-recommends imagemagick
        ./scripts/og-cards.sh
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: './out/'
        # .well-known/site.standard.publication must reach the artifact
        include-hidden-files: true
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
    - name: sync atproto
      continue-on-error: true
      env:
        ATPROTO_HANDLE: ${{ secrets.ATPROTO_HANDLE }}
        ATPROTO_APP_PASSWORD: ${{ secrets.ATPROTO_APP_PASSWORD }}
        ATPROTO_PDS_URL: ${{ secrets.ATPROTO_PDS_URL }}
      run: |
        if [ -z "$ATPROTO_HANDLE" ] || [ -z "$ATPROTO_APP_PASSWORD" ]; then
          echo "atproto secrets absent, skipping sync"; exit 0
        fi
        node scripts/sync-atproto.mjs
